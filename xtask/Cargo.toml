[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-oracle = { workspace = true }
pdfcraft-cos = { workspace = true }
anyhow = "1"
# TODO: repoint to storytold/craft-libs after upstream merge
craft-xtask = { git = "https://github.com/cloudbring/craft-libs", branch = "algo/integration" }
# TODO: repoint to storytold/craft-libs after upstream merge
craft-hash = { git = "https://github.com/cloudbring/craft-libs", branch = "algo/integration" }
lopdf = "0.45"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
# The demo-PDF time stamp goes through chrono (no hand-rolled calendar code).
chrono = { workspace = true }
